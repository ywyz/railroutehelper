name: Build Assistant

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore core solution
        run: dotnet restore RailRouteHelper.sln --locked-mode

      - name: Build and test core solution
        run: dotnet test RailRouteHelper.sln --no-restore --configuration Release

      - name: Download BepInEx
        shell: pwsh
        run: |
          $url = "https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.2/BepInEx_win_x64_5.4.23.2.zip"
          Invoke-WebRequest -Uri $url -OutFile bepinex.zip -UseBasicParsing
          Expand-Archive -Path bepinex.zip -DestinationPath .bepinex -Force

      - name: Build BepInEx plugin
        run: >-
          dotnet build RailRouteAssistant/RailRouteAssistant.csproj
          -c Release -p:GameDir="$env:GITHUB_WORKSPACE\.bepinex"

      - name: Publish desktop app (self-contained single-file)
        run: >-
          dotnet publish RailRouteAssistantDesktop/RailRouteAssistantDesktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/desktop

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailRouteAssistant-plugin
          path: RailRouteAssistant/bin/Release/net472/RailRouteAssistant.dll

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailRouteAssistantDesktop-exe
          path: publish/desktop/RailRouteAssistantDesktop.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RailRouteAssistant/bin/Release/net472/RailRouteAssistant.dll
            publish/desktop/RailRouteAssistantDesktop.exe
          generate_release_notes: true
