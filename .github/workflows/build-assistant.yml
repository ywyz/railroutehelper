name: Build Assistant

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download BepInEx
        shell: pwsh
        run: |
          $url = "https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip"
          Invoke-WebRequest -Uri $url -OutFile bepinex.zip -UseBasicParsing
          Expand-Archive -Path bepinex.zip -DestinationPath .bepinex -Force

      - name: Build BepInEx plugin
        run: >-
          dotnet build RailRouteAssistant/RailRouteAssistant.csproj
          -c Release -p:GameDir="$env:GITHUB_WORKSPACE\.bepinex"

      - name: Prepare embedded installer payload
        shell: pwsh
        run: |
          $payload = "publish/installer-payload"
          New-Item -ItemType Directory -Force "$payload/BepInEx/plugins" | Out-Null
          Copy-Item ".bepinex/BepInEx/core" "$payload/BepInEx/core" -Recurse -Force
          Copy-Item ".bepinex/.doorstop_version" "$payload/.doorstop_version" -Force
          Copy-Item ".bepinex/changelog.txt" "$payload/changelog.txt" -Force
          Copy-Item ".bepinex/doorstop_config.ini" "$payload/doorstop_config.ini" -Force
          Copy-Item ".bepinex/winhttp.dll" "$payload/winhttp.dll" -Force
          Copy-Item "RailRouteAssistant/bin/Release/net472/RailRouteAssistant.dll" "$payload/BepInEx/plugins/RailRouteAssistant.dll" -Force
          Copy-Item "LICENSE-BepInEx.txt" "$payload/LICENSE-BepInEx.txt" -Force
          Compress-Archive -Path "$payload/*" -DestinationPath "publish/installer-payload.zip" -Force

      - name: Publish desktop app (self-contained single-file)
        run: >-
          dotnet publish RailRouteAssistantDesktop/RailRouteAssistantDesktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:InstallerPayloadZip="$env:GITHUB_WORKSPACE\publish\installer-payload.zip"
          -o publish/desktop

      - name: Build one-click Windows bundle
        shell: pwsh
        run: |
          $bundle = "publish/bundle"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item "publish/installer-payload" "$bundle/payload" -Recurse -Force
          Copy-Item "publish/desktop/RailRouteAssistantDesktop.exe" "$bundle/RailRouteAssistantDesktop.exe" -Force
          Copy-Item "INSTALL-WINDOWS.md" "$bundle/安装说明.md" -Force
          Copy-Item "LICENSE-BepInEx.txt" "$bundle/LICENSE-BepInEx.txt" -Force
          Copy-Item "THIRD_PARTY_NOTICES.md" "$bundle/THIRD_PARTY_NOTICES.md" -Force
          Compress-Archive -Path "$bundle/*" -DestinationPath "publish/RailRouteAssistant-Windows-x64.zip" -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "publish/RailRouteAssistant-Windows-x64.zip",
            "RailRouteAssistant/bin/Release/net472/RailRouteAssistant.dll",
            "publish/desktop/RailRouteAssistantDesktop.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii "publish/SHA256SUMS.txt"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailRouteAssistant-plugin
          path: RailRouteAssistant/bin/Release/net472/RailRouteAssistant.dll

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailRouteAssistantDesktop-exe
          path: publish/desktop/RailRouteAssistantDesktop.exe

      - name: Upload one-click bundle
        uses: actions/upload-artifact@v4
        with:
          name: RailRouteAssistant-Windows-x64
          path: |
            publish/RailRouteAssistant-Windows-x64.zip
            publish/SHA256SUMS.txt

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/RailRouteAssistant-Windows-x64.zip
            RailRouteAssistant/bin/Release/net472/RailRouteAssistant.dll
            publish/desktop/RailRouteAssistantDesktop.exe
            publish/SHA256SUMS.txt
          generate_release_notes: true
