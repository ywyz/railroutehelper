name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore RailRouteHelper.sln --locked-mode
      - run: dotnet test RailRouteHelper.sln --no-restore --configuration Release
      - name: Restore desktop assistant
        if: runner.os == 'Windows'
        run: dotnet restore RailRouteAssistantDesktop/RailRouteAssistantDesktop.csproj --locked-mode
      - name: Build desktop assistant
        if: runner.os == 'Windows'
        run: dotnet build RailRouteAssistantDesktop/RailRouteAssistantDesktop.csproj --no-restore --configuration Release

